# .65: /etc/nginx/conf.d/chuanho.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here: the static build of
# apps/web synced by infra/deploy.sh or by CI, and /api/, /auth/, /healthz to the Node server on loopback :5330.
#
# The page needs: its own scripts and styles (React writes inline style attributes, hence 'unsafe-inline' for
# styles only), images from itself and data:/blob: (the share card is drawn on a canvas and saved as a blob),
# audio from itself and blob: (the music library under /media/music/ is same-origin too), and the Cloudflare Web
# Analytics beacon injected at the zone.

server {
    listen 80;
    listen [::]:80;
    server_name chuanho.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chuanho.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/chuanho.hoandat.com.access.log;
    error_log  /var/log/nginx/chuanho.hoandat.com.error.log;

    root /var/www/chuanho/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Tilt (parallax) and vibration are used; camera, microphone and location are not.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(self), gyroscope=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The API (apps/server, systemd chuanho-server) on loopback :5330: sign-in, account data, sync, the quiet hour.
    # The Cloudflare real-IP restore is global on this host, so $remote_addr is the visitor's IP; the server trusts
    # X-Forwarded-For from loopback only. The server-level headers above are inherited here (harmless on JSON and
    # redirects); helmet adds its own. A full journal sync is under 2 MB, the server's own limit.
    location ~ ^/(api|auth)/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:5330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5330;
        proxy_set_header Host $host;
    }

    # Vite fingerprints everything under /assets/: cache it for a year.
    # The web manifest: the stock mime.types has no .webmanifest entry, so it would go out as
    # application/octet-stream. No add_header here, so the headers above still apply.
    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Pictures and sounds keep fixed names and may be replaced: a day of caching.
    location ~ ^/(art|audio)/ {
        # A `types` block replaces the whole map for this location, so it lists every kind of file kept here.
        types {
            audio/wav       wav;
            audio/mpeg      mp3;
            image/webp      webp;
            image/png       png;
            image/jpeg      jpg;
            image/svg+xml   svg;
        }
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 3D models and the Babylon.js decoders (meshopt, KTX2, zstd WebAssembly): fixed names, a day of caching.
    location ~ ^/(models|decoders)/ {
        types {
            model/gltf-binary glb;
            application/wasm  wasm;
            application/javascript js;
        }
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The AI music library (hours of tracks, too big for the repo and the release): kept on the server in
    # /var/www/chuanho/media/music, outside dist/, so deploys never touch it; uploaded by infra/upload-music.sh.
    # Track names carry a content hash, so they are cached for a year; the manifest is revalidated every time.
    # nginx answers byte ranges (206) for static files by default, which media elements use to stream and seek.
    location ^~ /media/music/ {
        root /var/www/chuanho;
        types {
            audio/mpeg       mp3;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /media/music/manifest.json {
        root /var/www/chuanho;
        types { application/json json; }
        gzip on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The page itself and the release marker are never cached, so a deploy shows at once.
    location ~ ^/(index\.html|RELEASE)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(self), gyroscope=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

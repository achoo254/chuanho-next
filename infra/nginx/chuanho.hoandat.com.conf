# .65: /etc/nginx/conf.d/chuanho.hoandat.com.conf. Cloudflare (proxied, SSL "full") -> here. Static files only:
# the build of apps/web synced by infra/deploy.sh or by CI.
#
# The page needs: its own scripts and styles (React writes inline style attributes, hence 'unsafe-inline' for
# styles only), images from itself and data:/blob: (the share card is drawn on a canvas and saved as a blob),
# audio from itself and blob: (the backing track is generated in the browser), and the Cloudflare Web Analytics
# beacon injected at the zone.

server {
    listen 80;
    listen [::]:80;
    server_name chuanho.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chuanho.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/chuanho.hoandat.com.access.log;
    error_log  /var/log/nginx/chuanho.hoandat.com.error.log;

    root /var/www/chuanho/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

    set $csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Tilt (parallax) and vibration are used; camera, microphone and location are not.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(self), gyroscope=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Vite fingerprints everything under /assets/: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Pictures and sounds keep fixed names and may be replaced: a day of caching.
    location ~ ^/(art|audio)/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The page itself and the release marker are never cached, so a deploy shows at once.
    location ~ ^/(index\.html|RELEASE)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(self), gyroscope=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
